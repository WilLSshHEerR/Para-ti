<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lúmina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>
    <div class="background-container">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div id="micro-particles-container"></div>
    </div>

    <script>
        // Generar micro-partículas aleatorias
        const container = document.getElementById('micro-particles-container');
        const particleCount = 800;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('micro-particle');

            // Posición aleatoria
            const x = Math.random() * 100;
            const y = Math.random() * 100;

            // Tamaño aleatorio para variedad visual
            const size = Math.random() * 2 + 1; // 1px a 3px
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;

            // Duración y retraso aleatorios (más lento para un efecto calmado)
            const duration = 10 + Math.random() * 15; // 10s a 25s
            const delay = Math.random() * 10;

            particle.style.left = `${x}%`;
            particle.style.top = `${y}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;

            container.appendChild(particle);
        }
    </script>

    <main class="container">
        <div class="solar-system">
            <header class="sun-center">
                <h1>Lúmina</h1>
                <p>Ruido de Perlin</p>
            </header>

            <div class="orbit-ring">
                <!-- Planeta 1: Partículas -->
                <a href="particles/index.html" class="planet-container planet-1">
                    <div class="planet planet-particles">
                        <div class="icon-overlay">✨</div>
                    </div>
                    <div class="planet-label">
                        <h3>Partículas</h3>
                        <p>Danza de luz</p>
                    </div>
                </a>

                <!-- Placeholder: Planeta Bloqueado -->
                <div class="planet-container planet-2">
                    <div class="planet planet-locked">
                        <div class="icon-overlay">🔒</div>
                    </div>
                    <div class="planet-label">
                        <h3>Próximamente</h3>
                        <p>Nuevo mundo</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Creado con ❤️ y código</p>
    </footer>
</body>

</html>
